name: Vigilar que producción sirve el código de main

# Origen (17-ago-2026): sendaia.es sirvió 6 días una web de mayo (sin
# WhatsApp/Aria/agente de voz) porque un deploy de `main` desactualizada pisó
# en silencio el bueno. HTTP 200 todo el rato: nadie lo notó hasta que Pachi
# abrió la web. Este check compara el HTML real de producción contra el
# commit de main y avisa por Telegram si un elemento clave falta.
# Ver bug_sendaia_web_main_desincronizada_pisaba_produccion en el cerebro.

on:
  push:
    branches: [main]
  schedule:
    - cron: '13 8 * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Esperar a que el deploy de Vercel se propague (solo en push)
        if: github.event_name == 'push'
        run: sleep 90

      - name: Descargar el HTML real de producción
        run: curl -sL --max-time 20 -o prod.html https://sendaia.es/

      - name: Comprobar que los elementos clave están presentes
        id: check
        run: |
          FALTAN=0
          RESUMEN=""
          for marker in "WhatsAppButton" "Escríbenos por WhatsApp" "Agente de voz" "Aria"; do
            if ! grep -qF "$marker" prod.html; then
              FALTAN=1
              RESUMEN="$RESUMEN, falta: $marker"
            fi
          done
          echo "faltan=$FALTAN" >> "$GITHUB_OUTPUT"
          echo "resumen=$RESUMEN" >> "$GITHUB_OUTPUT"

      - name: Avisar por Telegram si algo falta
        if: steps.check.outputs.faltan == '1'
        env:
          BOT_TOKEN: ${{ secrets.OPS_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.OPS_TELEGRAM_CHAT_ID }}
          RESUMEN: ${{ steps.check.outputs.resumen }}
        run: |
          MSG="ALERTA: sendaia.es no coincide con main (${RESUMEN}). Puede ser un deploy viejo pisando al bueno, como paso el 11-ago. Revisar en Vercel."
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MSG}"

      - name: Fallar el job si algo faltaba (queda visible en GitHub)
        if: steps.check.outputs.faltan == '1'
        run: exit 1
